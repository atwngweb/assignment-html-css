<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./build/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="h-[5000px]">
    <!-- Section 1 -->
    <div class="w-full h-screen bg-[#043873] overflow-hidden">
        <!-- Container -->
        <div class="w-[80%] relative h-screen mx-auto flex flex-col">
            <div class="scale-x-200 absolute top-[50%] translate-y-[-50%]"><img src="./image/img-wave.png" alt=""></div>

            <!-- Header -->
            <div class="h-23 flex items-center">
                <div class="image">
                    <a href="#">
                        <img src="./image/Logo.png" alt="" class="logo">
                    </a>
                </div>
                <nav class=" flex  flex-1 justify-end items-center mr-20">
                    <ul class="menu flex items-center text-white font-medium gap-8">

                        <li class=" relative">
                            <a class=" py-1.5 pl-4 pr-4 " href="#">Products</a>
                            <span
                                class="select-none cursor-pointer  absolute top-1.25 -right-4 inline-block w-2.5 h-2.5 border border-white border-t-transparent border-l-transparent rotate-45"></span>
                        </li>
                        <li class=" relative">
                            <a class=" py-1.5 pl-4 pr-4 " href="#">Solutions</a>
                            <span
                                class="select-none cursor-pointer  absolute top-1.25 -right-4 inline-block w-2.5 h-2.5 border border-white border-t-transparent border-l-transparent rotate-45"></span>
                        </li>
                        <li class=" relative">
                            <a class=" py-1.5 pl-4 pr-4 " href="#">Resourses</a>
                            <span
                                class="select-none cursor-pointer  absolute top-1.25 -right-4 inline-block w-2.5 h-2.5 border border-white border-t-transparent border-l-transparent rotate-45"></span>
                        </li>
                        <li class=" relative">
                            <a class=" py-1.5 pl-4 pr-4 " href="#">Pricing</a>
                            <span
                                class="select-none cursor-pointer  absolute top-1.25 -right-4 inline-block w-2.5 h-2.5 border border-white border-t-transparent border-l-transparent rotate-45"></span>
                        </li>
                    </ul>

                </nav>
                <div class="font-medium flex">
                    <button class="min-w-31.5 h-15 bg-amber-200 rounded-lg text-[#043873] text-[18px]">Login</button>
                    <a href="#"
                        class="inline-block min-w-56.75 h-15 leading-15 text-center bg-[#4F9CF9] rounded-lg ml-4 text-white text-[18px]">
                        Try Whitepace free
                        <span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </span>
                    </a>
                </div>
            </div>

            <!-- Hero -->
            <div class=" flex-1 flex items-center relative gap-5">
                <div class="w-[48%]">
                    <h2 class="font-bold text-[64px] text-white leading-[1.3]">Get More Done with whitepace</h2>
                    <p class="text-[18px] text-white leading-[1.6] tracking-wide mt-5 mb-10">Project management
                        software
                        that
                        enables your teams
                        to
                        collaborate, plan,
                        analyze and manage
                        everyday tasks</p>
                    <a href="#"
                        class="inline-block min-w-56.75 h-15 leading-15 text-center bg-[#4F9CF9] rounded-lg text-white text-[18px]">
                        Try Whitepace free
                        <span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </span>
                    </a>
                </div>
                <div class="flex-1 h-130 bg-gray-400">

                </div>
            </div>


        </div>
    </div>

    <!-- Section 2 -->
    <div class=" overflow-hidden pt-20">
        <!-- Container -->
        <div class="w-[80%] bg-amber-100 mx-auto">
            <div class="">
                sadfasd
            </div>
        </div>
    </div>

</body>

</html>
